name: Bug report
description: Report a problem with DevToolbox
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the sections below.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open tool X
        2. Paste …
        3. Click …
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages if any.
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool / area
      options:
        - JSON Formatter
        - Base64
        - Unix Timestamp
        - URL Parser
        - App shell / routing / theme
        - Other / not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS (e.g. Firefox 128 on Ubuntu 24.04)
      placeholder: Chrome 130 on macOS 15
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, sample input (non-sensitive), or related issues.
    validations:
      required: false
