name: Feature request
description: Suggest an enhancement to DevToolbox
title: '[feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        For proposing an entirely new utility tool, prefer the **New tool** template.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature as you imagine using it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or existing tools you looked at.
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links, or related issues.
    validations:
      required: false
